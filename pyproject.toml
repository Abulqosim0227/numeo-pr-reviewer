[project]
name = "numeo-pr-reviewer"
version = "0.1.0"
description = "Autonomous GitHub PR review agent"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
numeo-review = "numeo_pr_reviewer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numeo_pr_reviewer"]
